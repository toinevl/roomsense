name: teardown-devtest-lab

# Removes everything deploy-devtest-lab created (wishlist #68). Leaves the resource group
# and its role assignment so the demo can be redeployed.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE to remove the lab, VMs, network, NSG and budget"
        required: true

permissions:
  id-token: write
  contents: read

env:
  # Must match the labName default in infra/devtest-lab/main.bicep.
  LAB_NAME: dtl-costdemo-weu

jobs:
  teardown:
    if: inputs.confirm == 'DELETE'
    runs-on: ubuntu-latest
    environment: sandbox
    env:
      RESOURCE_GROUP: ${{ vars.DTL_RESOURCE_GROUP }}
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Delete in dependency order (lab and its VMs, VNet, NSG, budget)
        run: |
          [ -n "$RESOURCE_GROUP" ] || { echo "::error::DTL_RESOURCE_GROUP not set"; exit 1; }
          SUB="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          az resource delete -g "$RESOURCE_GROUP" --resource-type Microsoft.DevTestLab/labs -n "$LAB_NAME"
          az network vnet delete -g "$RESOURCE_GROUP" -n "vnet-$LAB_NAME"
          az network nsg delete -g "$RESOURCE_GROUP" -n "nsg-$LAB_NAME"
          az rest --method delete \
            --url "https://management.azure.com/subscriptions/$SUB/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Consumption/budgets/budget-$LAB_NAME?api-version=2023-05-01"
      - name: Verify nothing is left
        run: az resource list --resource-group "$RESOURCE_GROUP" -o table
